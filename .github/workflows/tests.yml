name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pure-logic:
    name: pure clinical logic (no LLM, no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only what tests/test_assessment.py, test_retrieval.py (lexical path
      # — no VOYAGE_API_KEY here, so no network), test_store.py, and
      # test_schema_utils.py actually import. Deliberately excludes
      # langchain/langgraph/fastapi/sqlalchemy: if these four files ever
      # start requiring the full stack, one of the pure-logic modules
      # (agents/assessment.py, memory/, rag/'s lexical path, schema_utils.py)
      # has leaked a dependency it shouldn't have, and this job should fail.
      - name: Install test dependencies
        run: pip install pydantic python-dotenv typing-extensions numpy requests pytest

      - name: Run pure-logic tests
        run: pytest tests/test_assessment.py tests/test_retrieval.py tests/test_store.py tests/test_schema_utils.py
        env:
          ANTHROPIC_API_KEY: ""

  full-suite:
    name: full suite (backend + pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Everything: the LangGraph/LangChain pipeline, RAG's semantic-path
      # imports, and the FastAPI/SQLAlchemy backend. No API key needed even
      # here — every test that would otherwise need one stubs the LLM call
      # at the same boundary the rest of the suite already does.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt

      - name: Run full suite
        run: pytest
        env:
          ANTHROPIC_API_KEY: ""
